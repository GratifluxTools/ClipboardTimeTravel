name: Build

# 手動実行、または Release が公開された時のみ動く
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
            artifact: ClipboardTimeTravel-windows
          - os: ubuntu-latest
            target: linux
            artifact: ClipboardTimeTravel-linux
    runs-on: ${{ matrix.os }}
    env:
      # Windows の既定コードページ(cp1252)では flet/rich の記号出力で落ちるため UTF-8 を強制
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux 依存パッケージ
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev xclip xdotool

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 依存関係のインストール
        run: |
          pip install "flet[cli]==0.28.3"
          pip install -r requirements.txt

      - name: ビルド
        run: flet build ${{ matrix.target }}

      - name: パッケージ化（Windows）
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "build/windows/*" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: パッケージ化（Linux）
        if: matrix.target == 'linux'
        run: cd build/linux && zip -r "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" .

      - name: Actions の成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

      - name: Release に添付（Release 公開時のみ）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.artifact }}.*
